<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Allure Недоступен</title>
    <link rel="stylesheet" href="/app.css"/>
</head>
<body>
<div class="nav">
    <a href="/">Dashboard</a>
    <a href="/settings">Настройки</a>
    <a href="/queue">Очередь</a>
    <a href="/logs">Логи</a>
    <a href="/dependencies">Зависимости</a>
    <a href="/account/change-password">Сменить пароль</a>
    <form class="logout-form" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="nav-btn" type="submit">Выход</button>
    </form>
</div>

<div class="container">
    <div class="card">
        <h2>Отчет Allure недоступен</h2>
        <p th:text="${message}">Отчет Allure для этого прогона не найден.</p>
        <p class="small">runId: <span th:text="${runId}">—</span></p>

        <div class="row-actions" style="margin-top:12px;">
            <a class="btn secondary" href="/">На Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
